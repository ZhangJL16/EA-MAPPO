name = "recurrence_tail"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RecurrenceTail"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc1"

[[lean_lib]]
name = "RecurrenceTail"
