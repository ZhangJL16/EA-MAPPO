[project]
name = "uav-learning-research"
version = "0.1.0"
description = "Independent 3D analytic navigation prototype for online UAV delivery research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.15,<2",
  "osqp>=1.0,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nav3d"]
