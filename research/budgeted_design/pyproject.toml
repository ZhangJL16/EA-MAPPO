[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgeted-design-prototype"
version = "0.1.0"
description = "Development-only budget-conditioned history reading on DAD location finding"
requires-python = ">=3.10"
dependencies = ["torch>=2.7,<2.8", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
