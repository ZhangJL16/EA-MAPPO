[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-adaptation-study"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["stable-baselines3==2.8.0", "gymnasium==1.2.3", "numpy==1.26.4", "casadi==3.7.2", "pybullet==3.2.7", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
